name: QUINN Cross-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: quinn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$($package.version)") {
            throw "Release tag $tag does not match package version $($package.version)"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Build application icons
        run: npm run icons

      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: quinn-windows-release
          path: electron-release-optimized/
          if-no-files-found: error
          retention-days: 3

  android:
    name: Build signed Android release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Verify Android signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.QUINN_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.QUINN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUINN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QUINN_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "Missing QUINN_ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing QUINN_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing QUINN_ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing QUINN_ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore Android signing keystore
        env:
          KEYSTORE: ${{ secrets.QUINN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/quinn-release.jks"
          test -s "$RUNNER_TEMP/quinn-release.jks"

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          QUINN_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/quinn-release.jks
          QUINN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QUINN_ANDROID_KEYSTORE_PASSWORD }}
          QUINN_ANDROID_KEY_ALIAS: ${{ secrets.QUINN_ANDROID_KEY_ALIAS }}
          QUINN_ANDROID_KEY_PASSWORD: ${{ secrets.QUINN_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare Android release asset
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk \
            "release-output/QUINN-Android-${TAG}.apk"
          cd release-output
          sha256sum "QUINN-Android-${TAG}.apk" > "QUINN-Android-${TAG}.apk.sha256"

      - name: Upload Android release files
        uses: actions/upload-artifact@v4
        with:
          name: quinn-android-release
          path: release-output/*.apk*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish combined GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - android
    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@v4
        with:
          name: quinn-windows-release
          path: release-assets/windows

      - name: Download Android release files
        uses: actions/download-artifact@v4
        with:
          name: quinn-android-release
          path: release-assets/android

      - name: Verify release assets
        shell: bash
        run: |
          find release-assets -type f -maxdepth 3 -print
          find release-assets/windows -type f -iname '*.exe' | grep -q . \
            || { echo "Windows installer missing"; exit 1; }
          test -f release-assets/windows/latest.yml \
            || { echo "Electron latest.yml missing"; exit 1; }
          find release-assets/android -type f -iname '*.apk' | grep -q . \
            || { echo "Android APK missing"; exit 1; }
          find release-assets/android -type f -name '*.apk.sha256' | grep -q . \
            || { echo "Android APK checksum missing"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QUINN AI ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/windows/**/*
            release-assets/android/**/*.apk
            release-assets/android/**/*.sha256
