name: Build QUINN Apps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quinn-manual-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Build application icons
        run: npm run icons

      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: quinn-windows-${{ github.sha }}
          path: electron-release-optimized/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release-output/QUINN-Android-debug.apk

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: quinn-android-debug-${{ github.sha }}
          path: release-output/*.apk
          if-no-files-found: error
          retention-days: 14
